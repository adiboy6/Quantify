version: "3.8"

services:
  api:
    image: quantify.azurecr.io/dashboard-api:v1
    container_name: dashboard-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - dashboard-network

  ui:
    image: quantify.azurecr.io/dashboard-ui:v1
    container_name: dashboard-ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      REACT_APP_VITE_API_URL: "http://api:5000" # Using the service name `api` to link the backend
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
